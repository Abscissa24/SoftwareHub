y":"- Dynamic Info Pill Bar: Real-time display for current pairings and live standings.\n- Tournament Controls: Full round history access with manual pairing adjustments and standings overrides.\n- UI Restoration: Re-enabled scrollbars (increased thickness slated for next release).\n- Hotfixes: Resolved edge-case regressions in the standings logic.\n- Dependency Hardening: Patched vulnerabilities and updated core modules.\n- Refactored State Management: Optimised data flow for pairing updates to reduce latency.\n- UX Polishing: Improved layout consistency and CSS rendering.\n- Integration of board numbers.\n- Expanded scrollbar hitboxes.\n- Improved animation rendering\n- Improved smoothness","assets":[{"name":"CCU.exe","size":8965324,"browser_download_url":"https://github.com/Abscissa24/CCU/releases/download/4.260414/CCU.exe","digest":"sha256:f7014e5caa7434d8a4f5fdc3a4bcd81db6ffc4038369460385099d12028c2b17"},{"name":"Chess.Coach.Utility_4.26.414_x64-setup.exe","size":2369781,"browser_download_url":"https://github.com/Abscissa24/CCU/releases/download/4.260414/Chess.Coach.Utility_4.26.414_x64-setup.exe","digest":"sha256:0b52cc45df91a17c6ec4ccc0cab17b3ee21825b972073c71050c8645b09526c2"}]},{"tag_name":"v4.260530","prerelease":false,"published_at":"2026-06-01T15:41:07Z","html_url":"https://github.com/Abscissa24/CCU/releases/tag/v4.260530","body":"- Unified Tournament Bar: Integrated Current Pairings, Round Navigation, and Live Standings into a single, cohesive layout for improved tournament management.\n- Toggleable Performance Mode: Strips all compositing, animations, bezier curves, and gradient blurs to deliver a massive +172% performance boost.\n- In-Tournament Player Search: Added a dedicated search bar within individual tournament panels to instantly filter and locate active players.\n- Visual Board Numbers: Implemented clear board markers across tournament layouts to streamline physical seating and match organization.\n- Live Standing Override Feature: Rolled out administrative override privileges for active leaderboards, deployed successfully in the UGU Open 2026.\n- Explicit Delete Round Action: Added direct database commands and matching UI actions to completely remove specific rounds from active tournament records.\n- Editable Tournament Records: Enabled instant inline renaming of active and archived tournament profiles directly inside the administration interface.\n- Database Index DOB Configuration: Expanded the foundational database structure to support explicit Date of Birth records inside core indexing routines.\n- Hard Factory Reset Module: Programmed a deep sanitization routing to wipe local databases, settings cache, and reset the application back to pristine defaults.\n- Full Aesthetic Scrollbars: Replaced standard system scroll elements with styled, high-visibility UI components for a premium look and feel.\n- Enhanced Tournament Timer Functionality: Hardened the real-time match countdown clocks for absolute synchronization and stability under heavy system load.\n- Advanced Player Categories: Introduced deep player branching to separate age or skill divisions (e.g., Under 13 vs. Open) without relying on single-branch clusters.\n- Interactive Hypothetical Rating Feature: Estimates unrated player strength by carouselling through active database profiles, computing the mean rating between the highest beatable opponent and lowest definitive loss.\n- Rich Introduction Page: Added an initial welcome screen to showcase application features, highlight password protection, and prompt Google authentication.\n- Custom Avatar Support: Enabled user-facing image and logo uploads, allowing schools and clubs to brand their local user interface.\n- Native Google Authentication: Built explicit Google sign-in integration for secure cloud-based profile management.\n- Direct Email Integration: Expanded connectivity options by embedding dedicated email workflows directly within the client interface.\n- Live GIST Changelog Module: Added a pre-download utility that pulls the latest changelog text directly from a remote Gist before updating the client software.\n- Remote Maintenance Mode Switch: Wired a Gist-controlled remote killswitch that allows developers to toggle update availability and lock client versions instantly.\n- Refactored Rating Calculation Formula: Tuned the underlying mathematical formulas responsible for processing competitive performance metrics.\n- Optimized Rating Calculation Algorithm: Rewrote the processing loops behind player rating adjustments to drastically cut computational overhead.\n- Fixed Environment UI Scaling: Junked the clunky slider mechanic in favor of clean, pre-configured UI scaling constants (60%, 80%, 100%, 125%, and 150%).\n- 43% Footprint Reduction: Streamlined foundational source code execution trees, directly driving down the total compiled application binary size by 43%.\n- 198 Codebase Optimizations: Undertook an aggressive architectural review to maximize efficiency and clean up redundant algorithmic workflows.\n- 83 Targeted Bug Fixes: Eliminated 83 discovered bugs and edge-case application crashes reported across testing cycles.\n- 23 Structural Patches: Applied 23 targeted patches to smooth over system-specific quirks and ensure rock-solid framework reliability.\n- Overhauled Embedded Dev Options: Completely rewrote internal developer controls to offer cleaner local debugging tools and explicit configuration overrides.\n- Streamlined UI Settings Layout: Stripped visual clutter out of primary settings panels to ensure a cleaner, highly scannable design language.\n- Hamburger Menu Navigation Adjustments: Relocated the global application settings access point to the bottom-left corner of the primary sliding menu.\n- De-Isolated Configuration Panels: Migrated hidden standalone settings directly into their matching UI functional modules to minimize nested navigation.\n- Migrated Cloud Architecture: Dropped legacy local Git sync mechanics completely to pivot toward a modern, lightweight Firebase and GitHub Gist infrastructure.\n- Removed Monetization Framework: Completely excised the internal Monthly Subscription billing engine and matching code logic.\n- Removed Local License Verification: Deleted all local anti-piracy validation checks to open the application codebase up for seamless deployments.\n- Removed PIN Access Modals: Cleared out the localized PIN modal overlays from user authentication checkpoints.\n- Removed Legacy Localized Databases: Extracted outmoded local data storage systems in preparation for robust online backends.\n- Removed Localized Tournament Influx System: Shelved old tournament ingest pipelines to make way for unified structural parsing routines.\n- Purged Hardcoded Environment Variables: Cleaned up foundational config classes by removing all hidden static strings and raw hardcoded constants.\n- Purged Hardcoded Branding Assets: Fully stripped embedded school profiles, trainer names, hardcoded logos, and regional metadata from application binaries.","assets":[{"name":"CCU.exe","size":9175040,"browser_download_url":"https://github.com/Abscissa24/CCU/releases/download/v4.260530/CCU.exe","digest":"sha256:a4796ec8bd615d111f7c8ceb90b474c96a7c8dd9485b16c3911fc36822621d7b"}]},{"tag_name":"4.260413","prerelease":false,"published_at":"2026-04-13T10:29:07Z","html_url":"https://github.com/Abscissa24/CCU/releases/tag/4.260413","body":"Quick compile for Izotsha testing. 4.260413 Includes all latest patches and bleeding-edge features! There is no newer version than this All dependencies compiled into a elf-contained executable","assets":[{"name":"CCU.exe","size":8881438,"browser_download_url":"https://github.com/Abscissa24/CCU/releases/download/4.260413/CCU.exe","digest":"sha256:58b659ced24566ee5da3b2fe57c75e523b9db47a3cdf87ca833763f3069f5d4f"},{"name":"Chess.Coach.Utility_4.26.413_x64-setup.exe","size":2285895,"browser_download_url":"https://github.com/Abscissa24/CCU/releases/download/4.260413/Chess. // ---- releases (live from GitHub, with a saved fallback) ----
function fmtSize(b){return!b?"":b<1048576?Math.round(b/1024)+" KB":+(b/1048576).toFixed(2)+" MB"}
function fmtDate(i){var d=new Date(i);return isNaN(d)?"":d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
function mapRel(r){var b={};
  KINDS.forEach(function(k){var x=(r.assets||[]).filter(function(a){return k[4].test(a.name)})[0];
    if(x)b[k[0]]={u:x.browser_download_url,n:x.name,s:fmtSize(x.size),h:(x.digest||"").replace(/^sha256:/,"")}});
  return{tag:r.tag_name,v:String(r.tag_name).replace(/^(RT-|CCU-|v)/i,""),pre:!!r.prerelease,date:r.published_at,url:r.html_url,body:r.body||"",b:b,dc:(r.assets||[]).reduce(function(s,a){return s+(a.download_count||0)},0)}}
function latest(a){var rels=Array.isArray(a.rels)?a.rels:[];return rels.filter(function(r){return!r.pre})[0]||rels[0]}
function sel(a){var rels=Array.isArray(a.rels)?a.rels:[];return rels.filter(function(r){return r.tag===a.sel})[0]||latest(a)}
function plats(a){var r=a.soon?null:latest(a);return r?GROUPS.filter(function(g){return KINDS.some(function(k){return k[1]===g&&r.b&&r.b[k[0]]})}):[]}
function setRels(a,d,st,quiet){a.rels=d.filter(function(r){return!r.draft}).map(mapRel);a.state=st;if(!quiet)paint()}
function load(a){
  var key="hub-rel-"+a.repo,c=null;
  try{c=JSON.parse(localStorage.getItem(key)||"null")}catch(e){}
  if(c&&Date.now()-c.t<12e4){setRels(a,c.d,"live");return}
  var ac=new AbortController(),to=setTimeout(function(){ac.abort()},7000);
  fetch((API_BASE?API_BASE+"/releases/"+a.repo:"https://api.github.com/repos/"+a.repo+"/releases?per_page=40"),{headers:{Accept:"application/vnd.github+json"},signal:ac.signal})
   .then(function(r){if(!r.ok)throw 0;return r.json()})
   .then(function(d){clearTimeout(to);if(!Array.isArray(d))throw 0;
     d=d.filter(function(r){return!r.draft}).map(function(r){return{tag_name:r.tag_name,prerelease:r.prerelease,published_at:r.published_at,html_url:r.html_url,body:r.body,assets:(r.assets||[]).map(function(x){return{name:x.name,size:x.size,browser_download_url:x.browser_download_url,digest:x.digest,download_count:x.download_count}})}});
     try{localStorage.setItem(key,JSON.stringify({t:Date.now(),d:d}))}catch(e){}
     setRels(a,d,"live")})
    .catch(function(){clearTimeout(to);a.state="fallback";paint()});
}
function renderReview(a,d){
  var el=$("rv-"+a.id);
  if(!el)return;
  if(!d.length)el.innerHTML='<p class="none">No reviews yet. Be the first to write one!</p>';
  else el.innerHTML=d.map(function(r){
    var stars="";for(var i=0;i<5;i++){stars+=i<r.rating?"★":"☆"}
    var who=r.email||"Anonymous";
    return'<div class="review"><div class="rv" aria-label="'+r.rating+' stars">'+stars+'</div><p>'+esc(r.message||'')+'</p><div class="rwho">'+esc(who)+' · '+fmtDate(r.t)+'</div></div>'
  }).join('');
}
function loadReviews(a){
  var key="hub-rev-"+a.repo,c=null;
  try{c=JSON.parse(localStorage.getItem(key)||"null")}catch(e){}
  if(c&&Date.now()-c.t<12e4){renderReview(a,c.d);return}
  if(!API_BASE)return;
  var ac=new AbortController(),to=setTimeout(function(){ac.abort()},7000);
  fetch(API_BASE+"/reviews/"+a.repo,{headers:{Accept:"application/vnd.github+json"},signal:ac.signal})
   .then(function(r){if(!r.ok)throw 0;return r.json()})
   .then(function(d){clearTimeout(to);if(!Array.isArray(d))throw 0;
     try{localStorage.setItem(key,JSON.stringify({t:Date.now(),d:d}))}catch(e){}
     renderReview(a,d)})
   .catch(function(){clearTimeout(to);var el=$("rv-"+a.id);if(el)el.innerHTML='<p class="none">Could not load reviews.</p>'});
}

function il(t){return esc(t.replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/<[^>]+>/g,"")).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" rel="noopener">$1</a>')}
function md(s){var o="",ul=false;
  s.split(/\r?\n/).forEach(function(l){var t=l.trim(),m=t.match(/^[-*+]\s+(.*)/);
    if(m){if(!ul){o+="<ul>";ul=true}o+="<li>"+il(m[1])+"</li>";return}
    if(ul){o+="</ul>";ul=false}
    if(!t)return;
    m=t.match(/^#{1,6}\s+(.*)/);o+=m?"<p><strong>"+il(m[1])+"</strong></p>":"<p>"+il(t)+"</p>"});
  return o+(ul?"</ul>":"")}
function reqs(b){var o=[],on=false;
  b.split(/\r?\n/).forEach(function(l){var t=l.trim();
    if(/^#{1,6}\s*(system\s+)?requirements/i.test(t)){on=true;return}
    if(on){if(/^#{1,6}\s/.test(t))on=false;else{var m=t.match(/^[-*+]\s+(.*)/);if(m)o.push(m[1])}}});
  return o}

function hint(){var u=navigator.userAgent;return/Ubuntu/i.test(u)?"ubuntu":/Fedora/i.test(u)?"fedora":/Debian/i.test(u)?"debian":""}

function pkey(r){var d=detect(),k="";if(d==="win"||d==="apk")k=d;else if(d==="linux")k=r.b[hint()]?hint():r.b.uni?"uni":"";return k&&r.b[k]?k:""}
var HOWTO={
 win:["Windows",["Open the file you just downloaded. You’ll find it in your Downloads folder.","If Windows shows “Windows protected your PC”, click <b>More info</b>, then <b>Run anyway</b>. This message is normal for apps from independent developers.","If an installer window opens, follow the steps. Then open the app from the Start menu."]],
 apk:["Android",["Open the downloaded file from your notifications or the Downloads app.","If your phone asks, allow installs from this source. This is normal for apps you download outside the Play Store.","Tap <b>Install</b>, then open the app."]],
 deb:["Ubuntu and Debian",["Double-click the downloaded file. Your software installer will open.","Click <b>Install</b> and enter your password if asked.","Open the app from your applications menu."]],
 rpm:["Fedora",["Double-click the downloaded file to open it in Software.","Click <b>Install</b> and enter your password if asked.","Open the app from your applications menu."]],
 arch:["Arch Linux",["Open a terminal in the folder with the download.","Run this command, then open the app from your applications menu:"]],
 uni:["Linux",["Right-click the file, open <b>Properties</b>, and allow it to run as a program.","Double-click it to start the app. Or run this command in a terminal:"]]};
function guideHTML(a){var r=sel(a),k=a.guide;if(!r||!k||!r.b[k])return"";
  var g=HOWTO[k==="ubuntu"||k==="debian"?"deb":k==="fedora"?"rpm":k],c=(k==="arch"||k==="uni")?CMD[k](r.b[k].n):"";
  return'<div class="guide"><b>How to install on '+g[0]+'</b><ol>'+g[1].map(function(x){return'<li>'+x+'</li>'}).join('')+'</ol>'+(c?'<div class="cmd"><code>'+esc(c)+'</code>'+cp(c)+'</div>':'')+'<button class="lnk" data-guide-close="1">Hide</button></div>'}
function notes(s){var g={New:[],Improved:[],Fixed:[]},p=[],skip=false;
  s.split(/\r?\n/).forEach(function(l){var t=l.trim(),m=t.match(/^[-*+]\s+(.*)/);
    if(/^#{1,6}\s/.test(t)){skip=/requirements/i.test(t);return}
    if(skip||!t||/github/i.test(t))return;
    if(m){var x=m[1];g[/^(fix|resolv|repair|patch)/i.test(x)?"Fixed":/^(add|new|introduc|implement|integrat|support|launch)/i.test(x)?"New":"Improved"].push(x)}
    else p.push(t)});
  var o=p.map(function(t){return'<p>'+il(t)+'</p>'}).join('');
  ["New","Improved","Fixed"].forEach(function(k){if(g[k].length)o+='<h4 class="ng">'+k+'</h4><ul>'+g[k].map(function(x){return'<li>'+il(x)+'</li>'}).join('')+'</ul>'});
  return o||'<p>No notes for this version.</p>'}
function helpHTML(a){var h='';
  if(API_BASE)h+='<form class="frm" data-f="subscribe" data-a="'+a.id+'"><h3>Get notified of new versions</h3><div class="fr"><input type="email" name="email" required placeholder="Your email address" aria-label="Email address"><button class="go" type="submit">Notify me</button></div><p class="fm" aria-live="polite"></p></form>';
  if(API_BASE||CONTACT_EMAIL)h+='<form class="frm" data-f="feedback" data-a="'+a.id+'"><h3>Report a problem or share an idea</h3><textarea name="message" rows="3" required placeholder="What happened, or what would you like to see?" aria-label="Your message"></textarea><div class="fr">'+(API_BASE?'<input type="email" name="email" placeholder="Your email (optional)" aria-label="Your email, optional">':'')+'<button class="go" type="submit">Send</button></div><p class="fm" aria-live="polite"></p></form>';
  if(API_BASE)h+='<form class="frm" data-f="review" data-a="'+a.id+'"><h3>Write a review</h3><div class="stars"><span data-s="1">★</span><span data-s="2">★</span><span data-s="3">★</span><span data-s="4">★</span><span data-s="5">★</span></div><textarea name="message" rows="3" required placeholder="What do you think of this app?" aria-label="Your review"></textarea><div class="fr"><input type="email" name="email" placeholder="Your email (optional)" aria-label="Your email, optional"><button class="go" type="submit">Submit review</button></div><p class="fm" aria-live="polite"></p></form>';
  return h?'<div class="forms">'+h+'</div>':''}
function pageHTML(id){var p=PAGES[id];return'<div class="wrap"><div class="bar"><a href="#">← All software</a><span class="brand">'+SITE+'</span>'+tog()+'</div><div class="page"><h1>'+p.t+'</h1>'+p.h+(CONTACT_EMAIL?'<h2>Contact</h2><p><a href="mailto:'+esc(CONTACT_EMAIL)+'">'+esc(CONTACT_EMAIL)+'</a></p>':'')+'</div></div>'+foot()}
function prim(r){
  var d=detect(),k="";
  if(d==="win"||d==="apk")k=d;else if(d==="linux")k=r.b[hint()]?hint():r.b.uni?"uni":"";
  if(k&&r.b[k]){var kd=kind(k),nm=k==="win"?"Windows":k==="apk"?"Android":k==="uni"?"Linux":kd[2];
    return'<a class="btn big" data-k="'+k+'" href="'+esc(r.b[k].u)+'">Download for '+nm+'<small>'+kd[3]+(r.b[k].s?", "+r.b[k].s:"")+'</small></a>'}
  if(!Object.keys(r.b).length)return'<span class="btn big off">No downloads yet<small>Check back soon</small></span>';
  if(d==="linux"&&KINDS.some(function(x){return x[1]==="Linux"&&r.b[x[0]]}))return'<button class="btn big" data-open="1">Download for Linux<small>Choose your distribution</small></button>';
  if(OSN[d])return'<button class="btn big off" data-open="1">No '+OSN[d]+' build yet<small>See other downloads</small></button>';
  return'<button class="btn big" data-open="1">Choose a download<small>All platforms</small></button>'}

function dlHTML(a){
  var r=sel(a);if(!r)return'<div class="prim"><span class="btn big off">No releases yet<small>Check back soon</small></span></div>';
  var d=detect(),lt=latest(a),h='',meta=["Version "+r.v+(r.pre?" (beta)":"")];
  if(r.date)meta.push("Updated "+fmtDate(r.date));
  var tot=a.rels.reduce(function(s,x){return s+x.dc},0);if(a.state==="live"&&tot>=50)meta.push(tot.toLocaleString("en-US")+" downloads");
  var pk=pkey(r);if(pk)meta.push('<button class="lnk" data-guide="'+pk+'">How to install</button>');
  
  h+='<div class="prim">'+prim(r)+'<div class="meta">'+meta.map(function(m){return'<span>'+m+'</span>'}).join('')+'</div></div>';
  h+='<div id="guide">'+guideHTML(a)+'</div>';
  if(d==="mac")h+='<p class="note">macOS and iOS builds aren’t available. The builds that exist are listed under Other downloads.</p>';
  if(a.state==="fallback")h+='<p class="note">We couldn’t check for the newest version right now, so this list may be out of date.</p>';
  var nb=a.rels.filter(function(x,i){return x.pre&&i<a.rels.indexOf(lt)})[0];
  if(nb&&r===lt)h+='<p class="note">A beta is available: version '+esc(nb.v)+'. <button class="lnk" data-beta="'+esc(nb.tag)+'">Try the beta</button></p>';
  if(r!==lt)h+='<p class="note">'+(r.pre?'Version '+r.v+' is a pre-release (beta) and may be unstable.':'You’re viewing version '+r.v+', an older release.')+' <button class="lnk" data-latest="1">Switch to the latest</button></p>';
  h+='<details class="alt" id="alt"'+(a.altOpen?' open':'')+'><summary>Other downloads'+(a.rels.length>1?', previous versions and betas':'')+'</summary><div class="altin">';
  if(a.rels.length>1)h+='<label class="vrow">Version <select id="vsel">'+a.rels.map(function(x){return'<option value="'+esc(x.tag)+'"'+(x===r?' selected':'')+'>'+esc(x.v)+(x===lt?' (latest)':'')+(x.pre?' (beta)':'')+'</option>'}).join('')+'</select></label>';
  h+='<div class="dl">';
  GROUPS.forEach(function(g){
    var av=KINDS.filter(function(k){return k[1]===g&&r.b[k[0]]});
    h+='<div><h3>'+g+'</h3>'+(av.length?'<div class="btns">':'<p class="na">Not available for this version</p>');
    av.forEach(function(k){var e=r.b[k[0]];h+='<a class="btn'+(k[0]===d||k[0]===hint()?' rec':'')+'" data-k="'+k[0]+'" href="'+esc(e.u)+'">'+k[2]+'<small>'+k[3]+(e.s?", "+e.s:"")+'</small></a>'});
    h+=(av.length?'</div>':'')+'</div>';
  });
  h+='</div>';
  var adv="",cm=[];KINDS.filter(function(k){return k[1]==="Linux"&&r.b[k[0]]}).forEach(function(k){var c=CMD[k[0]](r.b[k[0]].n),x=cm.filter(function(y){return y[1]===c})[0];x?x[0]+=" / "+k[2]:cm.push([k[2],c])});
  if(cm.length)adv+='<details><summary>Linux install commands</summary>'+cm.map(function(m){return'<div class="cmd"><b>'+m[0]+'</b><code>'+esc(m[1])+'</code>'+cp(m[1])+'</div>'}).join('')+'</details>';
  var sums=[];KINDS.forEach(function(k){var e=r.b[k[0]];if(e&&e.h){var x=sums.filter(function(y){return y[1]===e.h})[0];x?x[0]+=" / "+k[2]:sums.push([k[2],e.h])}});
  if(sums.length)adv+='<details><summary>Verify your download (checksum)</summary>'+sums.map(function(s){return'<div class="cmd"><b>'+s[0]+'</b><code>'+s[1]+'</code>'+cp(s[1])+'</div>'}).join('')+'</details>';
  
  if(adv)h+='<details><summary>For advanced users</summary>'+adv+'</details>';
  return h+'</div></details>';
}
function logHTML(a){
  var r=sel(a),req=r?reqs(r.body):[],logs=a.rels.filter(function(x){return x.body.trim()});
  if(!logs.length&&!req.length)return'';
  var h='<div class="two"><div>';
  if(logs.length){h+='<h2>What’s new</h2>';logs.forEach(function(x,i){h+='<details'+(i?'':' open')+'><summary>Version '+esc(x.v)+(x.pre?' <span class="badge">Beta</span>':'')+'<span class="d">'+fmtDate(x.date)+'</span></summary>'+notes(x.body)+'</details>'})}
  h+='</div><div>';
  if(req.length)h+='<h2>Requirements</h2><ul>'+req.map(function(t){return'<li>'+il(t)+'</li>'}).join('')+'</ul>';
  return h+'</div></div>'}

// ---- pages ----
function card(a){
  if(a.soon)return'<div class="card '+a.theme+' soon"><div class="row"><img src="'+a.icon+'" alt=""><div><h2>'+a.name+'</h2><p>'+a.tag+'</p></div></div><p>'+a.lede+'</p><div class="chips"><span>Coming soon</span></div></div>';
  var r=latest(a),pl=plats(a),beta=r&&a.rels.some(function(x,i){return x.pre&&i<a.rels.indexOf(r)});
  return'<a class="card '+a.theme+'" href="#'+a.id+'"><div class="row"><img src="'+a.icon+'" alt=""><div><h2>'+a.name+'</h2><p>'+a.tag+'</p></div></div><p>'+a.lede+'</p><div class="chips">'+(r?'<span>v'+esc(r.v)+'</span>':'')+pl.map(function(p){return'<span>'+p+'</span>'}).join('')+(beta?'<span>Beta available</span>':'')+'</div><span class="go">View and download</span></a>'}
function cards(){
  var l=APPS.filter(function(a){var t=(a.name+" "+a.tag+" "+a.lede).toLowerCase();return t.indexOf(q.toLowerCase().trim())>-1&&(pf==="All"||plats(a).indexOf(pf)>-1)});
  return l.length?l.map(card).join(''):'<p class="none">No software matches that search. Try a different word or platform.</p>'}
function tog(){return '<button class="tog" id="tog">Theme: '+th()+'</button>'}
function foot(){
  var l=FOOT.filter(function(f){return f[1]}).map(function(f){return'<a href="'+esc(f[1])+'">'+f[0]+'</a>'}).join('');
  return '<footer class="wrap">'+l+'<span>© '+new Date().getFullYear()+' '+SITE+'</span></footer>';
}
function home(){
  return '<div class="wrap"><div class="bar"><span class="brand">'+SITE+'</span>'+tog()+'</div><div class="intro"><h1>Apps you can download</h1><p>Small, focused tools for Windows, Linux and Android. Pick one to see what it does and grab the right build.</p></div>'+
  '<div class="tools"><input id="q" type="search" placeholder="Search software" aria-label="Search software" value="'+esc(q)+'">'+
  ["All","Windows","Linux","Android"].map(function(p){return'<button class="fl" data-pf="'+p+'" aria-pressed="'+(pf===p)+'">'+p+'</button>'}).join('')+
  '</div><div class="cards" id="cards">'+cards()+'</div><p class="soonp">More software is on the way.</p></div>'+foot();
}

function app(a){
  var h='<div class="top"><div class="wrap"><div class="bar"><a href="#">← All software</a><span class="brand">'+SITE+'</span>'+tog()+'</div><div class="hero"><div class="id"><img src="'+a.icon+'" alt=""><div><h1>'+a.name+'</h1><p class="lede">'+a.lede+'</p></div></div><div id="dlarea">'+dlHTML(a)+'</div></div></div></div><div class="wrap body"><h2>Gallery</h2><div class="grid">';
  a.shots.forEach(function(s,i){var vid=/\.(mp4|webm)$/i.test(s[0]);
    h+='<figure>'+(vid?'<video class="shot" src="'+esc(s[0])+'" controls muted playsinline preload="metadata"></video>':'<button class="zoom" data-i="'+i+'" aria-label="Enlarge: '+esc(s[1])+'">'+(s[0]?'<img class="shot" src="'+esc(s[0])+'" alt="'+esc(s[1])+'">':'<div class="shot ph"></div>')+'</button>')+'<figcaption>'+s[1]+'</figcaption></figure>'});
  h+='</div><dl class="feat">'+a.feat.map(function(f){return'<div><dt>'+f[0]+'</dt><dd>'+f[1]+'</dd></div>'}).join('')+'</dl><div id="logarea">'+logHTML(a)+'</div>'+helpHTML(a)+(API_BASE?'<div class="reviews"><h3>Review</h3><div id="rv-'+a.id+'"><p class="none">Loading reviews…</p></div></div>':'');
  var rest=APPS.filter(function(x){return x!==a});
  if(rest.length)h+='<div class="more"><h2>More software</h2><div class="cards">'+rest.map(card).join('')+'</div></div>';
  return h+'</div>'+foot();
}
function nf(){return '<div class="wrap"><div class="bar"><span class="brand">'+SITE+'</span>'+tog()+'</div><div class="nf"><h1>We couldn’t find that app</h1><p>The address may be out of date, or the app has been renamed.</p><a class="go" href="#">Browse all software</a></div></div>'+foot()}

// theme
var THS=["Auto","Light","Dark"];
function th(){var v="Auto";try{v=localStorage.getItem("hub-theme")||"Auto"}catch(e){}return THS.indexOf(v)>-1?v:"Auto"}
function applyTh(v){var r=document.documentElement;if(v==="Auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",v.toLowerCase())}
applyTh(th());

// lightbox
function lbShow(){var s=lb.a.shots[lb.i];
  $("lbc").innerHTML=(/\.(mp4|webm)$/i.test(s[0])?'<video class="shot" src="'+esc(s[0])+'" controls autoplay muted playsinline></video>':s[0]?'<img class="shot" src="'+esc(s[0])+'" alt="'+esc(s[1])+'">':'<div class="shot ph t-'+lb.a.id+'"></div>')+'<p>'+s[1]+' ('+(lb.i+1)+' of '+lb.a.shots.length+')</p>'}
function lbOpen(a,i,from){lb={a:a,i:i,from:from};lbShow();$("lb").hidden=false;$("lb").querySelector(".x").focus();$("lb").className=a.theme}
function lbClose(){$("lb").hidden=true;if(lb.from)lb.from.focus()}
function lbNav(d){var n=lb.a.shots.length;lb.i=(lb.i+d+n)%n;lbShow()}
document.addEventListener("keydown",function(e){
  if($("lb").hidden)return;
  if(e.key==="Escape")lbClose();else if(e.key==="ArrowRight")lbNav(1);else if(e.key==="ArrowLeft")lbNav(-1);
});


function paint(){
  var a=byId(location.hash.slice(1));
  if(!a){if($("cards"))$("cards").innerHTML=cards();return}
  if($("dlarea")){$("dlarea").innerHTML=dlHTML(a);$("logarea").innerHTML=logHTML(a);
    var mc=document.querySelector(".more .cards");if(mc)mc.innerHTML=APPS.filter(function(x){return x!==a}).map(card).join('')}
}
var tt;
function toast(m){var t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2200)}
document.addEventListener("toggle",function(e){if(e.target.id==="alt"){var a=byId(location.hash.slice(1));if(a)a.altOpen=e.target.open}},true);
document.addEventListener("change",function(e){
  if(e.target.id==="vsel"){var a=byId(location.hash.slice(1));a.sel=e.target.value;$("dlarea").innerHTML=dlHTML(a);$("logarea").innerHTML=logHTML(a);$("vsel").focus()}});
document.addEventListener("click",function(e){
  var t=e.target,b,a=byId(location.hash.slice(1));
  if(b=t.closest("a.btn[data-k]")){a.guide=b.dataset.k;var gd=$("guide");if(gd)gd.innerHTML=guideHTML(a);return}
  if(b=t.closest("[data-guide-close]")){a.guide="";$("guide").innerHTML="";return}
  if(b=t.closest("[data-guide]")){a.guide=b.dataset.guide;$("guide").innerHTML=guideHTML(a);$("guide").scrollIntoView({behavior:"smooth",block:"nearest"});return}
  if(b=t.closest("[data-open]")){a.altOpen=true;var d=$("alt");d.open=true;d.scrollIntoView({behavior:"smooth",block:"center"});return}
  if(b=t.closest("[data-beta]")){a.sel=b.dataset.beta;a.altOpen=true;$("dlarea").innerHTML=dlHTML(a);$("logarea").innerHTML=logHTML(a);return}
  if(b=t.closest("[data-latest]")){a.sel=latest(a).tag;$("dlarea").innerHTML=dlHTML(a);$("logarea").innerHTML=logHTML(a);return}
  if(b=t.closest("[data-copy]")){var v=b.dataset.copy;
    (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(function(){toast("Copied")},function(){toast("Couldn’t copy. Select the text instead.")});return}
  if(b=t.closest("[data-i]")){lbOpen(a,+b.dataset.i,b);return}
  if(b=t.closest("[data-lb]")){var k=b.dataset.lb;k==="x"?lbClose():lbNav(k==="n"?1:-1);return}
  if(t.id==="lb"){lbClose();return}
   if(b=t.closest("[data-pf]")){pf=b.dataset.pf;document.querySelectorAll(".fl").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.pf===pf)});$("cards").innerHTML=cards();return}
   if(b=t.closest("[data-s]")){var frm=b.closest("form");if(frm){frm.dataset.rating=b.dataset.s;frm.querySelectorAll("[data-s]").forEach(function(s,i){s.classList.toggle("selected",i<+b.dataset.s)})}return}
   if(t.id==="tog"){var n=THS[(THS.indexOf(th())+1)%3];try{localStorage.setItem("hub-theme",n)}catch(x){}applyTh(n);t.textContent="Theme: "+n}
});
document.addEventListener("input",function(e){if(e.target.id==="q"){q=e.target.value;$("cards").innerHTML=cards()}});
document.addEventListener("submit",function(e){
  var f=e.target;if(!f.dataset||!f.dataset.f)return;e.preventDefault();
  var a=byId(f.dataset.a),r=sel(a),m=f.querySelector(".fm"),fd=new FormData(f),ctx=a.name+(r?" "+r.v:"")+" ("+(OSN[detect()]||detect()||"unknown")+")";
   if(f.dataset.f==="feedback"&&!API_BASE){location.href="mailto:"+CONTACT_EMAIL+"?subject="+encodeURIComponent("Problem report: "+ctx)+"&body="+encodeURIComponent(fd.get("message")||"");return}
   if(f.dataset.f==="review"&&(!f.dataset.rating||+f.dataset.rating<1)){m.textContent="Please select a star rating.";return}
   var body=f.dataset.f==="subscribe"?{repo:a.repo,app:a.name,email:fd.get("email")}:f.dataset.f==="review"?{repo:a.repo,app:a.name,rating:+f.dataset.rating||0,message:fd.get("message"),email:fd.get("email")||""}:{app:a.name,version:r?r.v:"",os:detect(),message:fd.get("message"),email:fd.get("email")||""};
   m.textContent="Sending…";
   fetch(API_BASE+"/"+f.dataset.f,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(x){if(!x.ok)throw 0;m.textContent=f.dataset.f==="subscribe"?"Thanks! We’ll email you when a new version is out.":f.dataset.f==="review"?"Thanks for your review!":"Thanks, your message was sent.";f.reset();if(f.dataset.f==="review"){f.dataset.rating="";f.querySelectorAll("[data-s]").forEach(function(s){s.classList.remove("selected")});try{localStorage.removeItem("hub-rev-"+a.repo)}catch(e){}loadReviews(a)}})
    .catch(function(){m.textContent="Sorry, that didn’t send. Please try again later."});
});
document.addEventListener("error",function(e){var t=e.target;if(!t||!t.matches||!t.matches("img.shot,video.shot"))return;
  var f=t.closest("figure");if(t.tagName==="VIDEO"&&f){f.remove();return}
  var ph=document.createElement("div");ph.className="shot ph";t.replaceWith(ph)},true);
function route(){
  var id=location.hash.slice(1),a=byId(id);if(a&&a.soon)a=null;
  $("view").innerHTML=a?app(a):PAGES[id]?pageHTML(id):id?nf():home();
  document.body.className=a?a.theme:"";
  document.title=a?a.name+" - "+SITE:PAGES[id]?PAGES[id].t+" - "+SITE:id?"Not found - "+SITE:SITE;
  if(!$("lb").hidden)$("lb").hidden=true;
  window.scrollTo(0,0);
  if(a)loadReviews(a);
}
// Seed release data before the first render. This prevents the homepage
// from crashing when a release fetch/cache has not completed yet.
APPS.forEach(function(a){
  if(!Array.isArray(a.rels)){
    a.rels=(SNAP[a.repo]||[]).filter(function(r){return !r.draft}).map(mapRel);
  }
  if(!a.state)a.state="fallback";
});

// Render immediately, then keep hash-based navigation in sync.
window.addEventListener("hashchange", route);
route();

APPS.forEach(function(a){if(!a.soon)load(a);loadReviews(a)});

  </script>

      </div>
      <div class="admSection active" data-section="reports">
        <div class="admControls"><input class="admSearch" id="admSearchReports" placeholder="Search reports..." type="search"></div>
        <div id="admReportsList"><p class="admEmpty">Loading…</p></div>
      </div>
      <div class="admSection" data-section="subscribers">
        <div class="admControls"><input class="admSearch" id="admSearchSubscribers" placeholder="Search subscribers..." type="search"></div>
        <table class="admTable"><thead><tr><th>App</th><th>Repository</th><th>Email</th><th>Signed up</th><th>Delete</th></tr></thead><tbody id="admSubscribersBody"></tbody></table>
      </div>
      <div class="admSection" data-section="reviews">
        <div class="admControls"><input class="admSearch" id="admSearchReviews" placeholder="Search reviews..." type="search"></div>
        <div id="admReviewsList"><p class="admEmpty">Loading…</p></div>
      </div>
    </div>
  </div>

  <script>
  // ===== Admin console =====
  var adminToken = null;
  var adminBrandClicks = 0;

  // Easter egg: 5 clicks on the brand name opens the admin login modal
  document.addEventListener("click", function(e) {
    if (e.target.classList.contains("brand") || (e.target.closest && e.target.closest(".brand"))) {
      var b = e.target.closest(".brand") || e.target;
      if (b.textContent.includes(SITE) && !location.hash) {
        adminBrandClicks++;
        if (adminBrandClicks >= 5) {
          adminBrandClicks = 0;
          showAdminModal();
        }
        return;
      }
    }
  });

  function showAdminModal() {
    $("adminModal").hidden = false;
    $("adminPass").value = "";
    $("adminErr").textContent = "";
    $("adminPass").focus();
  }

  $("adminCancelBtn").addEventListener("click", function() {
    $("adminModal").hidden = true;
  });

  $("adminPass").addEventListener("keydown", function(e) {
    if (e.key === "Escape") $("adminModal").hidden = true;
    if (e.key === "Enter") adminLogin();
  });

  function adminLogin() {
    var pass = $("adminPass").value.trim();
    if (!pass) return;
    $("adminErr").textContent = "Checking…";
    fetch(API_BASE + "/admin/check?token=" + encodeURIComponent(pass), { headers: { "Accept": "application/json" } })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.ok) {
          adminToken = pass;
          $("adminModal").hidden = true;
          $("adminDash").hidden = false;
          loadAdminData();
        } else {
          $("adminErr").textContent = "Invalid token.";
        }
      })
      .catch(function() { $("adminErr").textContent = "Network error. Try again."; });
  }

  $("adminLoginBtn").addEventListener("click", adminLogin);

  $("adminCloseDash").addEventListener("click", function() {
    $("adminDash").hidden = true;
    adminToken = null;
  });

  // Tab switching
  document.addEventListener("click", function(e) {
    if (!$("adminDash").hidden) {
      var tab = e.target.closest("[data-tab]");
      if (tab) {
        document.querySelectorAll(".admTab").forEach(function(t) { t.classList.toggle("active", t === tab); });
        document.querySelectorAll("[data-section]").forEach(function(s) { s.classList.toggle("active", s.dataset.section === tab.dataset.tab); });
      }
    }
  });

  var adminData = { reports: [], subscribers: [], reviews: [] };

  function loadAdminData() {
    if (!adminToken) return;
    var h = { "Accept": "application/json" };
    Promise.all([
      fetch(API_BASE + "/admin/feedback?token=" + adminToken, { headers: h }).then(r => r.json()),
      fetch(API_BASE + "/admin/subscribers?token=" + adminToken, { headers: h }).then(r => r.json()),
      fetch(API_BASE + "/admin/reviews?token=" + adminToken, { headers: h }).then(r => r.json())
    ]).then(function(d) {
      adminData.reports = d[0] || [];
      adminData.subscribers = d[1] || [];
      adminData.reviews = d[2] || [];
      renderAdminTab("reports");
      renderAdminTab("subscribers");
      renderAdminTab("reviews");
    }).catch(function() {
      $("admReportsList").innerHTML = '<p class="admEmpty">Failed to load data.</p>';
    });
  }

  function renderAdminTab(tab) {
    if (tab === "reports") {
      var f = $("admSearchReports").value.toLowerCase();
      var items = adminData.reports.filter(function(r) {
        return (r.app + " " + (r.message||"") + " " + (r.email||"")).toLowerCase().indexOf(f) > -1;
      });
      $("admReportsList").innerHTML = items.length ? items.map(function(r) {
        var parts = String(r.key || "").split(":");
        var when = parts[1] ? fmtDate(parseInt(parts[1])) : "";
        return '<div class="admItem"><div class="meta"><span>' + esc(r.app||"") + '</span>' + (r.version?'<span>v'+esc(r.version)+'</span>':'') + (r.os?'<span>'+esc(r.os)+'</span>':'') + '<span class="date">' + esc(when) + '</span></div><div class="msg">' + esc(r.message||"").replace(/\n/g,"<br>") + '</div><div class="email">' + (r.email?'<a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a>':'No email') + '</div><button class="del" data-type="fb" data-key="'+esc(r.key)+'">Delete</button></div>';
      }).join("") : '<p class="admEmpty">No reports match.</p>';
    } else if (tab === "subscribers") {
      var s = $("admSearchSubscribers").value.toLowerCase();
      var items2 = adminData.subscribers.filter(function(x) {
        return (x.app + " " + (x.email||"")).toLowerCase().indexOf(s) > -1;
      });
      $("admSubscribersBody").innerHTML = items2.length ? items2.map(function(x) {
        var rest = String(x.key || "").slice(4);
        var i2 = rest.indexOf(":");
        var repo = i2 > -1 ? rest.slice(0, i2) : rest;
        var email = i2 > -1 ? rest.slice(i2 + 1) : "";
        return '<tr><td>' + esc(x.app||"") + '</td><td><code>' + esc(repo) + '</code></td><td><a href="mailto:' + esc(email) + '">' + esc(email) + '</a></td><td>' + (x.t?esc(fmtDate(x.t)):"") + '</td><td><button class="del" data-type="sub" data-key="' + esc(x.key) + '">Delete</button></td></tr>';
      }).join("") : '<tr><td colspan="5"><p class="admEmpty">No sign-ups match.</p></td></tr>';
    } else if (tab === "reviews") {
      var rv = $("admSearchReviews").value.toLowerCase();
      var items3 = adminData.reviews.filter(function(r) {
        return (r.app + " " + (r.message||"") + " " + (r.email||"")).toLowerCase().indexOf(rv) > -1;
      });
      $("admReviewsList").innerHTML = items3.length ? items3.map(function(r) {
        var parts = String(r.key || "").split(":");
        var repo = parts[1] || "";
        var when = parts[2] ? fmtDate(parseInt(parts[2])) : "";
        var stars = "";
        for (var i = 0; i < 5; i++) stars += i < (r.rating||0) ? "★" : "☆";
        return '<div class="admItem"><div class="meta"><span>' + esc(r.app||"") + '</span><code>' + esc(repo) + '</code><span style="color:#ffd43b">' + stars + '</span><span class="date">' + esc(when) + '</span></div><div class="msg">' + esc(r.message||"").replace(/\n/g,"<br>") + '</div><div class="email">' + (r.email?'<a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a>':'Anonymous') + '</div><button class="del" data-type="rev" data-key="'+esc(r.key)+'">Delete</button></div>';
      }).join("") : '<p class="admEmpty">No reviews match.</p>';
    }
  }

  // Search filtering
  document.addEventListener("input", function(e) {
    if (!$("adminDash").hidden) {
      if (e.target.id === "admSearchReports") renderAdminTab("reports");
      if (e.target.id === "admSearchSubscribers") renderAdminTab("subscribers");
      if (e.target.id === "admSearchReviews") renderAdminTab("reviews");
    }
  });

  // Delete record
  document.addEventListener("click", function(e) {
    if (!$("adminDash").hidden) {
      var btn = e.target.closest(".del[data-key]");
      if (btn) {
        var type = btn.dataset.type, key = btn.dataset.key;
        if (confirm("Delete this record?")) {
          fetch(API_BASE + "/admin/delete?token=" + adminToken, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ type: type, key: key })
          }).then(function(r) { return r.json(); })
           .then(function(d) {
             if (d.ok) { loadAdminData(); toast("Deleted."); }
             else toast("Delete failed.");
           }).catch(function() { toast("Delete failed."); });
        }
      }
    }
  });
  </script>
 </body>
</html>
